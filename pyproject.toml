[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emoney-mcp"
version = "1.0.25"
description = "MCP server for Emoney Advisor financial planning"
readme = "README_PYPI.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    # Upper-bounded: nodriver 0.50.x's Connection.aopen() has a listener race
    # that, with websockets >= 14's strict asyncio impl, produces an infinite
    # "cannot call get() concurrently" loop. browser.py serializes aopen() to
    # work around it; the cap keeps the float from landing on an untested major.
    "nodriver>=0.34,<0.51",
    "pycryptodomex>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
emoney-mcp = "emoney_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/emoney_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start lenient: pyflakes (unused imports/vars, bad f-strings, undefined names)
# and the E9 syntax-error subset. Expand later as the codebase is cleaned.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Re-export shims: imports are intentionally "unused" — they exist to re-export.
"src/emoney_mcp/scraper.py" = ["F401", "F403"]
"src/emoney_mcp/scrapers/__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.11"
# Analyze as Linux (matching CI) so platform-narrowed branches — e.g. the
# Windows DPAPI path after `if sys.platform == "darwin": return` — are checked
# deterministically regardless of the developer's OS.
platform = "linux"
ignore_missing_imports = true
# Pragmatic baseline for a reverse-engineered, JSON-heavy codebase: keep the
# high-signal checks (None attribute access, undefined names, bad operators)
# and silence the type-precision noise that comes from untyped JSON dict values
# (every value is `object`, so heterogeneous dicts trip these codes constantly).
files = ["src/emoney_mcp"]
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = [
    "return-value", "arg-type", "assignment", "dict-item",
    "var-annotated", "misc", "call-overload", "index",
]

# nodriver ships source with a non-UTF-8 byte that breaks mypy's parser; we
# never type-check third-party code, so don't follow imports into it.
[[tool.mypy.overrides]]
module = "nodriver.*"
follow_imports = "skip"
ignore_errors = true

[tool.hatch.build]
exclude = [
    "tests/",
    ".github/",
    "test_*.py",
]
