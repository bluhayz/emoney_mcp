[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emoney-mcp"
version = "1.0.9"
description = "MCP server for Emoney Advisor financial planning"
readme = "README_PYPI.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "nodriver>=0.34",
    "pycryptodomex>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
emoney-mcp = "emoney_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/emoney_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start lenient: pyflakes (unused imports/vars, bad f-strings, undefined names)
# and the E9 syntax-error subset. Expand later as the codebase is cleaned.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Re-export shims: imports are intentionally "unused" — they exist to re-export.
"src/emoney_mcp/scraper.py" = ["F401", "F403"]
"src/emoney_mcp/scrapers/__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Pragmatic baseline — type-check the package without forcing full annotations.
files = ["src/emoney_mcp"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.hatch.build]
exclude = [
    "tests/",
    ".github/",
    "test_*.py",
]
