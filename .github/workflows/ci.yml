name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Syntax check & unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ scripts/ tests/

      - name: Type check (mypy)
        run: mypy src/emoney_mcp

      - name: Syntax check (all source files)
        run: |
          python -m py_compile src/emoney_mcp/server.py
          python -m py_compile src/emoney_mcp/scraper.py
          python -m py_compile src/emoney_mcp/browser.py
          echo "All files pass syntax check"

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: pip install -e .

      - name: Audit dependencies for known CVEs
        run: pip-audit --ignore-vuln PYSEC-2022-42969
        continue-on-error: true  # Advisory only — don't fail the build

  version-guard:
    name: Require version bump for src changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need history to diff against the base

      - name: Fail if src/ changed without a version bump
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          SRC_CHANGED=$(git diff --name-only "$BASE" HEAD -- src/emoney_mcp/ | wc -l | tr -d ' ')
          CUR=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          PREV=$(git show "$BASE:pyproject.toml" 2>/dev/null | grep '^version' | head -1 | sed 's/.*= *"\(.*\)"/\1/' || echo "none")
          echo "src files changed vs $BASE: $SRC_CHANGED"
          echo "version: $PREV -> $CUR"
          if [ "$SRC_CHANGED" -gt 0 ] && [ "$CUR" = "$PREV" ]; then
            echo "::error::Files under src/emoney_mcp/ changed but the pyproject.toml version was not bumped ($CUR). Bump the version so the package is republished to PyPI and picked up by Claude Desktop."
            exit 1
          fi
          echo "Version-bump guard OK."

  publish:
    name: Build and publish to PyPI
    needs: test  # gate: only publish if all unit-test matrix jobs pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # need previous commit to compare versions

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          PREVIOUS=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*= *"\(.*\)"/\1/' || echo "none")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.version_check.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build package
        if: steps.version_check.outputs.changed == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.version_check.outputs.changed == 'true'
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}

      - name: Skip publish (version unchanged)
        if: steps.version_check.outputs.changed == 'false'
        run: echo "Version ${{ steps.version_check.outputs.current }} already published — skipping PyPI upload."
