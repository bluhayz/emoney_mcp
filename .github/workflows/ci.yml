name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Syntax check & unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check (all source files)
        run: |
          python -m py_compile src/emoney_mcp/server.py
          python -m py_compile src/emoney_mcp/scraper.py
          python -m py_compile src/emoney_mcp/browser.py
          echo "All files pass syntax check"

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: pip install -e .

      - name: Audit dependencies for known CVEs
        run: pip-audit --ignore-vuln PYSEC-2022-42969
        continue-on-error: true  # Advisory only — don't fail the build
