[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emoney-mcp"
version = "0.1.1"
description = "MCP server for Emoney Advisor financial planning"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "nodriver>=0.34",
    "pycryptodomex>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
emoney-mcp = "emoney_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/emoney_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build]
exclude = [
    "tests/",
    ".github/",
    "test_*.py",
]
