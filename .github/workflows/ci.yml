name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Syntax check & unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check (all source files)
        run: |
          python -m py_compile src/emoney_mcp/server.py
          python -m py_compile src/emoney_mcp/scraper.py
          python -m py_compile src/emoney_mcp/browser.py
          echo "All files pass syntax check"

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: pip install -e .

      - name: Audit dependencies for known CVEs
        run: pip-audit --ignore-vuln PYSEC-2022-42969
        continue-on-error: true  # Advisory only — don't fail the build

  publish:
    name: Build and publish to PyPI
    needs: test  # gate: only publish if all unit-test matrix jobs pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit to compare versions

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          PREVIOUS=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*= *"\(.*\)"/\1/' || echo "none")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.version_check.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Build package
        if: steps.version_check.outputs.changed == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.version_check.outputs.changed == 'true'
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}

      - name: Skip publish (version unchanged)
        if: steps.version_check.outputs.changed == 'false'
        run: echo "Version ${{ steps.version_check.outputs.current }} already published — skipping PyPI upload."
