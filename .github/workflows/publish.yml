name: Publish to PyPI

on:
  push:
    branches: ["main"]

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit to compare versions

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          PREVIOUS=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*= *"\(.*\)"/\1/' || echo "none")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.version_check.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Build package
        if: steps.version_check.outputs.changed == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.version_check.outputs.changed == 'true'
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}

      - name: Skip publish (version unchanged)
        if: steps.version_check.outputs.changed == 'false'
        run: echo "Version ${{ steps.version_check.outputs.current }} already published — skipping PyPI upload."

